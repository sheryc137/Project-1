[tool.poetry]
name = "invest-dashboard-backend"
version = "0.1.0"
description = "Personal investment intelligence dashboard backend"
authors = ["You"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111"
uvicorn = {extras = ["standard"], version = ">=0.30"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0"}
asyncpg = ">=0.29"
alembic = ">=1.13"
pydantic-settings = ">=2.0"
redis = {extras = ["asyncio"], version = ">=5.0"}
apscheduler = ">=3.10"
robin-stocks = ">=3.0"
pyotp = ">=2.9"
anthropic = ">=0.28"
feedparser = ">=6.0"
praw = ">=7.7"
httpx = ">=0.27"
yfinance = ">=0.2"
vaderSentiment = ">=3.3"
python-dotenv = ">=1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
